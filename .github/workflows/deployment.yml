name: CI/CD Pipeline - Carosserie Oerlikon

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/carosserie-oerlikon

jobs:
  test-and-validate:
    name: Validate & Test Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      # --- DIAGNOSE-SCHRITT ---
      - name: Ordnerstruktur anzeigen
        run: ls -la
      # ------------------------

      - name: Node.js v22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Production Build prüfen
        run: npm run build
