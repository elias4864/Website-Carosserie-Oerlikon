name: CI/CD Pipeline - Carosserie Oerlikon

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/carosserie-oerlikon

jobs:
  test-and-validate:
    name: Validate & Test Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mein-react-template                                                                                                                                               


    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js v22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Tests ausführen (falls vorhanden)
        run: |
          npm run lint --if-present
          npm test -- --watchAll=false --if-present

      - name: Production Build prüfen
        run: npm run build

  build-and-push:
    name: Build & Push Docker Image
    needs: test-and-validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Bei GitHub Container Registry (GHCR) anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata & Tags generieren
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Docker Image erstellen und hochladen
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
