name: CI/CD Pipeline - Carosserie Oerlikon

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. TEST & BUILD JOB
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './mein-react-template/package-lock.json'

      - name: Abhängigkeiten installieren
        run: |
          cd mein-react-template
          npm ci

      - name: React App bauen (Vite Build Check)
        run: |
          cd mein-react-template
          npm run build

  # 2. DOCKER BUILD & PUSH JOB
  docker-build:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Bei GitHub Container Registry (GHCR) anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata extrahieren (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Docker Image bauen und pushen
        uses: docker/build-push-action@v5
        with:
          context: ./mein-react-template
          file: ./mein-react-template/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 3. DEPLOYMENT JOB (optional: Für deinen Server / VPS via SSH)
  deploy:
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Remote SSH Deployment
        # Aktiviere dies, sobald du SSH-Secrets im GitHub Repository hinterlegt hast
        # uses: appleboy/ssh-action@v1.0.3
        # with:
        #   host: ${{ secrets.SERVER_HOST }}
        #   username: ${{ secrets.SERVER_USER }}
        #   key: ${{ secrets.SERVER_SSH_KEY }}
        #   script: |
        #     cd /path/to/your/app
        #     docker compose pull
        #     docker compose up -d --remove-orphans
        run: echo "Deployment Schritt ausgeführt!"
