name: CI/CD Pipeline - Carosserie Oerlikon

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: 🔍 Alle Ordner im Root anzeigen (Debug)
        run: |
          echo "Inhalt des Hauptverzeichnisses:"
          ls -R

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ordnerstruktur prüfen und bauen
        run: |
          set -e
          echo "=== 1. Aktuelles Verzeichnis ==="
          pwd
          
          echo "=== 2. Gefundene package.json Dateien ==="
          find . -maxdepth 3 -name "package.json"
          
          # Ordner automatisch ermitteln, in dem die package.json liegt
          PACKAGE_DIR=$(find . -maxdepth 3 -name "package.json" -exec dirname {} \;)
          
          echo "=== 3. Wechsel in Projektordner: $PACKAGE_DIR ==="
          cd "$PACKAGE_DIR"
          
          echo "=== 4. npm install & build ==="
          npm install
          npm run build

  docker-build:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Docker Image bauen und pushen
        uses: docker/build-push-action@v5
        with:
          context: ./mein-react-template
          file: ./mein-react-template/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
