name: Dev CI Pipeline

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js Umgebung einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencies installieren & Frontend builden
        run: |
          echo "=== Aktuelles Verzeichnis ==="
          ls -la

          # Ordner suchen, der die package.json enthält
          TARGET_DIR=$(find . -maxdepth 2 -name "package.json" -exec dirname {} \; | head -n 1)
          echo "Gefundenes Projektverzeichnis: $TARGET_DIR"

          cd "$TARGET_DIR"
          
          # Verwende npm install statt npm ci, um fehlende Pakete zu ergänzen & Babel zu tolerieren
          npm install --legacy-peer-deps
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Image via Docker Compose bauen
        run: |
          TARGET_DIR=$(find . -maxdepth 2 -name "package.json" -exec dirname {} \; | head -n 1)
          cd "$TARGET_DIR"
          docker compose build frontend
