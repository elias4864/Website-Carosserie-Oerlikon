name: CI/CD Pipeline - Carosserie Oerlikon

on:
  push:
    branches:
      - dev

jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js Umgebung einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './mein-react-template/package-lock.json'

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Tests ausführen (falls vorhanden)
      - name: Frontend Dependencies installieren & Build testen
        working-directory: ./mein-react-template
        run: |
          npm run lint --if-present
          npm test -- --watchAll=false --if-present

      - name: Production Build prüfen
        run: npm run build
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Image via Docker Compose bauen
        run: |
          docker compose build frontend
