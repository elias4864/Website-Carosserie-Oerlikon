<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="./src/assets/OE.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carosserie Örlike TL AG</title>
  <script>
    /**
     * Dynamische Titel-Anpassung
     */
    function updateTitle() {
      const path = window.location.pathname;

      if (path.includes('/carosserie')) {
        document.title = "Carosserie–Carosserie Örlike TL AG";
      } else if (path.includes('/aufbereitung')) {
        document.title = "Aufbereitung–Carosserie Örlike TL AG";
      } else if (path.includes('/impressum')) {
        document.title = "Impressum–Carosserie Örlike TL AG";
      }

      else if (path.includes('/kontakt')) {
        document.title = "Kontakt–Carosserie Örlike TL AG";
      }


      else if(path.includes('/lackiererei')){
        document.title="Lackiererei- Carosserie Örlike TL AG";
      }
      else if(path.includes('/wiki')) {
        document.title = "Wiki- Carosserie Örlike TL AG";
      }

      else if(path.includes('/spenglerarbeiten'))
      {document.title = "Spenglerarbeiten- Carosserie Örlike TL AG";}



      else {
        document.title = "Home-Carosserie Örlike TL AG";
      }
    }

    // Für reguläre Navigations-Events
    window.addEventListener('popstate', updateTitle);
    document.addEventListener('DOMContentLoaded', updateTitle);

    // Observer für SPA-Routenänderungen im React-Root
    const observer = new MutationObserver(updateTitle);
    document.addEventListener('DOMContentLoaded', () => {
      const root = document.getElementById('root');
      if (root) {
        observer.observe(root, { childList: true, subtree: true });
      }
    });
  </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
