<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="./src/assets/OE.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Standard Meta-Tags -->
  <title>Home - Carrosserie Örlike TL AG</title>
  <meta id="meta-description" name="description" content="Ihr Spezialist für sämtliche Carrosserie-, Spengler- und Lackierarbeiten sowie Unfallreparaturen in Zürich Oerlikon. Seit 40 Jahren zuverlässig und zertifiziert." />
  <meta name="keywords" content="Carrosserie, Spenglerei, Lackiererei, Unfallreparatur, Zürich, Oerlikon, Carrosserie Suisse, Auto Lackieren" />
  <meta name="author" content="Carrosserie Örlike TL AG" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph Meta-Tags (Social Media Vorschau) -->
  <meta property="og:title" content="Carrosserie Örlike TL AG | Zürich" />
  <meta id="og-description" property="og:description" content="Ihr Spezialist für sämtliche Carrosserie- und Lackierarbeiten rund ums Fahrzeug in Zürich Oerlikon." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="de_CH" />

  <script>
    /**
     * Dynamische SEO-Anpassung (Titel & Description je nach Route)
     */
    function updateSEO() {
      const path = window.location.pathname;
      let title = "Home – Carrosserie Örlike TL AG";
      let description = "Ihr Spezialist für sämtliche Carrosserie-, Spengler- und Lackierarbeiten sowie Unfallreparaturen in Zürich Oerlikon. Seit 40 Jahren zuverlässig und zertifiziert.";

      if (path.includes('/spengler') || path.includes('/spenglerarbeiten')) {
        title = "Spenglerarbeiten – Carrosserie Örlike TL AG";
        description = "Professionelle Spenglerarbeiten und Karosseriereparaturen in Zürich Oerlikon. Präzise Instandsetzung von Blech- und Unfallschäden.";
      } else if (path.includes('/lackiererei')) {
        title = "Lackiererei – Carrosserie Örlike TL AG";
        description = "Umweltfreundliche Autolackierungen, Teillackierungen und Reparaturlackierungen mit höchster Farbtongenauigkeit in Oerlikon.";
      } else if (path.includes('/aufbereitung')) {
        title = "Autoaufbereitung – Carrosserie Örlike TL AG";
        description = "Professionelle Auto-Aufbereitung, Politur und Innenraumreinigung in Zürich. Ihr Fahrzeug im Neuwagen-Glanz.";
      } else if (path.includes('/reparatur')) {
        title = "Reparatur – Carrosserie Örlike TL AG";
        description = "Fachgerechte Instandsetzung nach Unfallschäden samt kompletter Abwicklung mit Ihrer Versicherung.";
      } else if (path.includes('/kontakt')) {
        title = "Kontakt & Anfahrt – Carrosserie Örlike TL AG";
        description = "Kontaktieren Sie die Carrosserie Örlike TL AG in Zürich Oerlikon. Öffnungszeiten, Adresse und Online-Anfrage.";
      } else if (path.includes('/impressum')) {
        title = "Impressum – Carrosserie Örlike TL AG";
        description = "Rechtliche Informationen und Impressum der Carrosserie Örlike TL AG in Zürich Oerlikon.";
      } else if (path.includes('/wiki')) {
        title = "WIKI & Ratgeber – Carrosserie Örlike TL AG";
        description = "Wissenswertes rund um Karosseriereparaturen, Versicherungsschäden und Fahrzeugpflege.";
      }
      else if(path.includes('/galerie')) {
        title="Galerie -Carosserie Örlike TL AG";
        description ="Die Carosserie Galerie der Carosserie Örlike TL AG";
      }

      else if(path.includes('/lackieren')) {
        title = "Autolackieren- Carosserie Örlike TL AG";
        description="Autolackieren bei der Carosserie Örlike TL AG";

      }

      else if(path.includes('/chatbot')) {
        title= "Chatbot-Carosserie Örlike TL AG";
        description="Chatbot -Carosserie Örlike TL AG";
      }
      else if(path.includes('/privacymodal')) {
        title = "Datenschutzerklärung öffnen- Carosserie Örlike TL AG";
        description = "Datenschutzerklärung bei dre Carosserie Örlike TL AG";
      }

      else if(path.includes('/termin')){
        title = "Termin vereinbaren -Carosserie Örlike TL AG";
        description = "Termin vereinbaren bei der Carosserie Örlike  TL AG";
      }

      else if(path.includes('/datenschutzerklärung')) {
        title = "Datenschutzerklärung- Carosserie Örlike TL AG";
        description="Datenschutzerklärung bei der Carosserie Örlike TL AG";
      }

      else if(path.includes('/anfrage')) {
        title= "Newsletter -Carosserie Örlike TL AG";
        description= "Newsletter abonnieren bei der Carosserie Örlike TL AG";
      }

      else if(path.includes('/autopflege')){
        title= "Autopflege- Carosserie Örlike TL AG";
        description= "Autopflege bei der Carosserie Örlike TL AG";
      }

      else if(path.includes('/fahrzeug')) {
        title= "Fahrzeugaufbereitung- Carosserie Örlike TL AG";
      }

      else if(path.includes('/chatbot')){
        title = "Chatbot Leo - Carosserie Örlike TL AG";
        description= "Der Ultimative Chatbot Leo ,beantwortet dir fragen run um die Website der Carosserie Örlike TL AG";
      }
      // 1. Titel aktualisieren
      document.title = title;

      // 2. Meta-Description aktualisieren
      const metaDesc = document.getElementById('meta-description');
      if (metaDesc) {
        metaDesc.setAttribute('content', description);
      }

      // 3. Open Graph Description aktualisieren
      const ogDesc = document.getElementById('og-description');
      if (ogDesc) {
        ogDesc.setAttribute('content', description);
      }
    }

    // Event-Listener für Navigation & initiales Laden
    window.addEventListener('popstate', updateSEO);
    document.addEventListener('DOMContentLoaded', updateSEO);

    // MutationObserver für React SPA-Routenwechsel
    const observer = new MutationObserver(updateSEO);
    document.addEventListener('DOMContentLoaded', () => {
      const root = document.getElementById('root');
      if (root) {
        observer.observe(root, { childList: true, subtree: true });
      }
    });
  </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
